<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>August Occasions - Ask us anything</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%237B2D8E'/%3E%3Cpath d='M6 8h12M6 12h8' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <style>
    :root {
      --color-bg: #FBF8FC;
      --color-surface: #ffffff;
      --color-primary: #7B2D8E;
      --color-primary-dark: #5E2270;
      --color-primary-hover: #6A2680;
      --color-text: #241B29;
      --color-text-muted: #5B4B63;
      --color-border: #E7DCEA;
      --color-user-bubble: #7B2D8E;
      --color-user-text: #ffffff;
      --color-assistant-bubble: #F3E8F7;
      --color-assistant-text: #241B29;
      --color-error: #b91c1c;
      --color-error-bg: #fdecea;
      --radius-lg: 18px;
      --radius-md: 12px;
      --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --space-1: 0.5rem;
      --space-2: 0.75rem;
      --space-3: 1rem;
      --space-4: 1.5rem;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-sans);
      background: var(--color-bg);
      color: var(--color-text);
      display: flex;
      justify-content: center;
      padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right))
               max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
    }

    .app {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }

    .app-header {
      text-align: center;
      padding: var(--space-4) var(--space-3);
      margin-bottom: var(--space-3);
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
      box-shadow: 0 8px 24px -8px rgba(94, 34, 112, 0.45);
    }
    .app-header h1 {
      font-size: 1.5rem;
      margin: 0 0 0.25rem;
      color: #fff;
      letter-spacing: 0.02em;
    }
    .app-header p { margin: 0; color: rgba(255, 255, 255, 0.85); font-size: 0.9375rem; }

    #gate, #chat { display: none; flex: 1; flex-direction: column; }
    #gate.active, #chat.active { display: flex; }

    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-top: 4px solid var(--color-primary);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      box-shadow: 0 4px 16px -8px rgba(36, 27, 41, 0.12);
    }
    #gate .card { margin: auto 0; }
    #gate .lead { margin: 0 0 var(--space-3); color: var(--color-text-muted); }

    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    form.gate-form, form.chat-form { display: flex; gap: var(--space-2); }

    input[type=text] {
      flex: 1;
      width: 100%;
      min-height: 44px;
      padding: 0 var(--space-3);
      font-size: 1rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-surface);
      color: var(--color-text);
    }
    input[type=text]:focus {
      outline: 2px solid var(--color-primary);
      outline-offset: 1px;
    }

    button {
      min-height: 44px;
      padding: 0 var(--space-4);
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: var(--radius-md);
      background: var(--color-primary);
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: var(--color-primary-hover); }
    button:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    button.ghost {
      background: transparent;
      color: var(--color-text-muted);
      border: 1px solid var(--color-border);
      font-weight: 500;
    }
    button.ghost:hover { background: var(--color-bg); }

    #log {
      flex: 1;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      background: var(--color-surface);
      padding: var(--space-3);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      margin-bottom: var(--space-3);
      min-height: 50vh;
    }

    .msg {
      max-width: 80%;
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      white-space: pre-wrap;
      line-height: 1.45;
      font-size: 0.9375rem;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--color-user-bubble);
      color: var(--color-user-text);
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--color-assistant-bubble);
      color: var(--color-assistant-text);
      border-bottom-left-radius: 4px;
    }
    .msg.error {
      align-self: center;
      background: var(--color-error-bg);
      color: var(--color-error);
      font-size: 0.875rem;
    }

    .typing {
      align-self: flex-start;
      display: flex;
      gap: 4px;
      padding: var(--space-2) var(--space-3);
      background: var(--color-assistant-bubble);
      border-radius: var(--radius-md);
      border-bottom-left-radius: 4px;
    }
    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-primary);
      opacity: 0.6;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-4px); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .typing span { animation: none; opacity: 1; }
    }

    .chat-footer { display: flex; flex-direction: column; gap: var(--space-2); }
    .end-row { text-align: center; }

    @media (min-width: 480px) {
      .app-header h1 { font-size: 1.75rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>August Occasions</h1>
      <p>Ask us anything</p>
    </header>

    <section id="gate" class="active">
      <div class="card">
        <p class="lead">Enter the access code you were given to start chatting.</p>
        <form id="gate-form" class="gate-form">
          <label class="visually-hidden" for="code-input">Access code</label>
          <input type="text" id="code-input" autocomplete="off" placeholder="Access code" required />
          <button type="submit">Start</button>
        </form>
        <p id="gate-error" class="msg error" role="alert"></p>
      </div>
    </section>

    <section id="chat">
      <div id="log" aria-live="polite"></div>
      <div class="chat-footer">
        <form id="chat-form" class="chat-form">
          <label class="visually-hidden" for="message-input">Your message</label>
          <input type="text" id="message-input" autocomplete="off" placeholder="Ask a question..." maxlength="2000" required />
          <button type="submit">Send</button>
        </form>
        <p class="end-row"><button type="button" id="end-chat" class="ghost">End chat</button></p>
      </div>
    </section>
  </div>

  <script src="/chat.js"></script>
</body>
</html>
